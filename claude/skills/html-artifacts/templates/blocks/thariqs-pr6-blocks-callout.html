<!-- BLOCK: callout
     USE WHEN: flagging a single important note inline — a decision, a risk/warning,
     a success criterion, or a plain note. Variants: note, warn, success, decision. -->
<div class="callout decision">
  <span class="tag">Decision</span>
  We will do X rather than Y because Z. State the trade-off, not just the choice.
</div>

<div class="callout warn">
  <span class="tag">Risk</span>
  What could go wrong and how it is mitigated.
</div>
