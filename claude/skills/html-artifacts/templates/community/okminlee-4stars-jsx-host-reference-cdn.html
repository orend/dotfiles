<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>${COMPONENT_NAME} preview</title>
  <!--
    Style-object naming rule: never write `const styles = {...}` in a Babel script.
    Multiple components with the same name collide silently in shared scope.
    Use unique names like `heroStyles`, `cardStyles`, etc.
  -->
  <style>
    html, body { margin: 0; padding: 0; }
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #f4f4f5; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    #app { padding: 32px; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="app"></div>
  <!--
    The starter JSX is inlined below (rather than loaded via <script src="${KIND}">)
    because Chromium blocks file:// XHR, which is what Babel uses to fetch external
    type="text/babel" sources. The starter file ${KIND} still ships next to this host
    HTML for editing/sharing; re-run copy-starter --with-host-html after edits to
    refresh this preview.
  -->
  <script type="text/babel">
${INLINE_JSX}
  </script>
  <script type="text/babel">
    const root = ReactDOM.createRoot(document.getElementById('app'));
    root.render(<${COMPONENT_NAME}><div style={{ padding: 24, color: '#444' }}>Sample content inside ${COMPONENT_NAME}</div></${COMPONENT_NAME}>);
  </script>
</body>
</html>
